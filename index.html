<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GymOS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a1628;--card:#122340;--line:#223a63;--tx:#fff;--mut:#93a8c9;--g:#22c55e;--r:#ef4444;--y:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select{font:inherit}
.hide{display:none!important}
.mut{color:var(--mut)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:380px}
h1,h2,h3{margin:0 0 12px}
label{display:block;margin-bottom:12px;color:var(--mut);font-size:13px}
input,select{display:block;width:100%;margin-top:5px;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0a1628;color:var(--tx)}
.btn{background:var(--g);color:#04210f;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.red{background:var(--r);color:#fff}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#app{display:flex;min-height:100vh}
#side{width:220px;background:#08111f;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;z-index:20;transition:transform .2s}
.logo{font-size:22px;font-weight:800;padding:0 10px 14px}.logo b{color:var(--g)}
#side a{padding:11px 12px;border-radius:9px;color:var(--mut);cursor:pointer}
#side a.on{background:var(--card);color:var(--g);font-weight:700}
#side .out{margin-top:auto}
#wrap{margin-left:220px;flex:1;min-width:0}
#top{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
#main{padding:20px;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .n{font-size:26px;font-weight:800;color:var(--g)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input{flex:1;min-width:140px;margin:0}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.tag.active,.tag.paid{background:#16a34a33;color:var(--g)}
.tag.expired,.tag.pending{background:#ef444433;color:#ff8a8a}
.tag.inactive{background:#64748b44;color:#cbd5e1}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
#modal .box{max-height:92vh;overflow:auto}
@media(max-width:800px){
#side{transform:translateX(-100%)}#side.open{transform:none}
#wrap{margin-left:0}#top{display:flex}#main{padding:14px}}
</style>
</head>
<body>

<div id="login">
  <form class="box" id="lf">
    <h1>Gym<span style="color:var(--g)">OS</span></h1>
    <p class="mut" style="margin-top:0">Sign in to manage your gym.</p>
    <label>Email<input type="email" id="em" required autocomplete="username"></label>
    <label>Password<input type="password" id="pw" required autocomplete="current-password"></label>
    <p id="lerr" style="color:#ff8a8a"></p>
    <button class="btn" style="width:100%">Sign in</button>
  </form>
</div>

<div id="app" class="hide">
  <nav id="side">
    <div class="logo">Gym<b>OS</b></div>
    <a data-v="dashboard">Dashboard</a>
    <a data-v="members">Members</a>
    <a data-v="plans">Plans</a>
    <a data-v="attendance">Attendance</a>
    <a data-v="payments">Payments</a>
    <a class="out" onclick="logout()">Sign out</a>
  </nav>
  <div id="wrap">
    <div id="top"><button class="btn ghost sm" onclick="document.getElementById('side').classList.toggle('open')">Menu</button><b id="gname"></b></div>
    <div id="main"></div>
  </div>
</div>
<div id="modal"></div>

<script>
const SB_URL='https://nygoppuratwzhbpbyhce.supabase.co';
const SB_KEY='sb_publishable_Oo78-dOuAZPSBQ6oU6dZsA_RO0I4plo';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const today=()=>fmt(new Date());
const addM=(s,n)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+Number(n));return fmt(d)};
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d)};
const money=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const ok=r=>{if(r.error)throw r.error;return r.data};
const act=async fn=>{try{await fn()}catch(e){alert(e.message||String(e))}};

let gym=null,plans=[],members=[],view='dashboard',q='';
const mName=id=>(members.find(m=>m.id===id)||{}).name||'Unknown';
const pOf=id=>plans.find(p=>p.id===id);
const eff=m=>m.status==='inactive'?'inactive':(m.expiry_date&&m.expiry_date<today()?'expired':'active');

// ---------- auth ----------
$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lerr').textContent=error.message;return}
  start();
};
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){
  const {data}=await sb.auth.getSession();
  if(!data.session){$('#login').classList.remove('hide');$('#app').classList.add('hide');return}
  const uid=data.session.user.id;
  const g=await sb.from('gyms').select('*').eq('owner_id',uid).maybeSingle();
  if(g.error||!g.data){$('#lerr').textContent='No gym found for this account.';await sb.auth.signOut();$('#login').classList.remove('hide');return}
  gym=g.data;$('#gname').textContent=gym.gym_name||'GymOS';
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  await reload();
}
async function reload(){
  await act(async()=>{
    plans=ok(await sb.from('membership_plans').select('*').eq('gym_id',gym.id).order('name'));
    members=ok(await sb.from('members').select('*').eq('gym_id',gym.id).order('name'));
  });
  render();
}
document.querySelectorAll('#side a[data-v]').forEach(a=>a.onclick=()=>{view=a.dataset.v;$('#side').classList.remove('open');render()});

// ---------- modal form ----------
function closeM(){$('#modal').style.display='none';$('#modal').innerHTML=''}
function openForm(title,fields,vals,onSave,after){
  const html=fields.map(x=>{
    const v=vals[x.k]??'';let inp;
    if(x.t==='select')inp=`<select name="${x.k}" ${x.req?'required':''}><option value="">Select</option>${x.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else inp=`<input name="${x.k}" type="${x.t||'text'}" value="${esc(v)}" ${x.req?'required':''} ${x.t==='number'?'step="any" inputmode="decimal"':''}>`;
    return `<label>${x.l}${inp}</label>`}).join('');
  $('#modal').innerHTML=`<div class="box"><h3>${title}</h3><form id="f">${html}<div class="row"><button type="button" class="btn ghost" onclick="closeM()">Cancel</button><button class="btn">Save</button></div></form></div>`;
  $('#modal').style.display='flex';
  const form=$('#f');if(after)after(form);
  form.onsubmit=e=>{e.preventDefault();const o={};new FormData(form).forEach((v,k)=>o[k]=v===''?null:v);
    act(async()=>{await onSave(o);closeM();await reload()})};
}
const del=(t,id,msg)=>{if(confirm(msg||'Delete this record?'))act(async()=>{ok(await sb.from(t).delete().eq('id',id));await reload()})};

// ---------- render ----------
async function render(){
  document.querySelectorAll('#side a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('#main').innerHTML='<p class="mut">Loading…</p>';
  await act(async()=>{await V[view]()});
}
const V={};

V.dashboard=async()=>{
  const t=today(),ms=t.slice(0,8)+'01',me=addM(ms,1),soon=addD(t,7);
  const [att,rev,pen]=await Promise.all([
    sb.from('attendance').select('id',{count:'exact',head:true}).eq('gym_id',gym.id).eq('attended_on',t),
    sb.from('payments').select('amount').eq('gym_id',gym.id).eq('status','paid').gte('payment_date',ms).lt('payment_date',me),
    sb.from('payments').select('amount').eq('gym_id',gym.id).eq('status','pending')]);
  [att,rev,pen].forEach(r=>{if(r.error)throw r.error});
  const active=members.filter(m=>eff(m)==='active').length;
  const exp=members.filter(m=>m.status!=='inactive'&&m.expiry_date&&m.expiry_date>=t&&m.expiry_date<=soon).sort((a,b)=>a.expiry_date.localeCompare(b.expiry_date));
  const lapsed=members.filter(m=>eff(m)==='expired');
  const sum=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);
  $('#main').innerHTML=`<h2>Dashboard</h2>
  <div class="grid">
   <div class="card"><div class="mut">Total members</div><div class="n">${members.length}</div></div>
   <div class="card"><div class="mut">Active members</div><div class="n">${active}</div></div>
   <div class="card"><div class="mut">Expiring in 7 days</div><div class="n">${exp.length}</div></div>
   <div class="card"><div class="mut">Today's attendance</div><div class="n">${att.count||0}</div></div>
   <div class="card"><div class="mut">Revenue this month</div><div class="n">${money(sum(rev.data))}</div></div>
   <div class="card"><div class="mut">Pending payments</div><div class="n">${money(sum(pen.data))}</div></div>
  </div>
  <h3>Renewals due this week</h3>
  ${exp.length?exp.map(m=>`<div class="item"><div><b>${esc(m.name)}</b><div class="mut">Expires ${m.expiry_date}${m.phone?' · '+esc(m.phone):''}</div></div><button class="btn sm" onclick="renew('${m.id}')">Renew</button></div>`).join(''):'<p class="mut">No renewals due in the next 7 days.</p>'}
  <h3 style="margin-top:20px">Expired memberships</h3>
  ${lapsed.length?lapsed.slice(0,10).map(m=>`<div class="item"><div><b>${esc(m.name)}</b><div class="mut">Expired ${m.expiry_date}</div></div><button class="btn sm" onclick="renew('${m.id}')">Renew</button></div>`).join(''):'<p class="mut">No expired memberships.</p>'}`;
};

V.members=async()=>{
  $('#main').innerHTML=`<h2>Members</h2><div class="bar"><input id="s" placeholder="Search by name or phone" value="${esc(q)}"><button class="btn" onclick="memberForm()">Add member</button></div><div id="ml"></div>`;
  $('#s').oninput=e=>{q=e.target.value;drawMembers()};drawMembers();
};
function drawMembers(){
  const k=q.toLowerCase();
  const list=members.filter(m=>!k||(m.name||'').toLowerCase().includes(k)||(m.phone||'').includes(k));
  $('#ml').innerHTML=list.length?list.map(m=>{const s=eff(m),p=pOf(m.plan_id);return `<div class="item"><div><b>${esc(m.name)}</b> <span class="tag ${s}">${s}</span>
   <div class="mut">${p?esc(p.name):'No plan'}${m.phone?' · '+esc(m.phone):''}</div>
   <div class="mut">${m.start_date||'—'} to ${m.expiry_date||'—'}</div></div>
   <div class="acts"><button class="btn sm" onclick="renew('${m.id}')">Renew</button><button class="btn sm ghost" onclick="memberForm('${m.id}')">Edit</button><button class="btn sm red" onclick="del('members','${m.id}','Delete this member?')">Delete</button></div></div>`}).join(''):'<p class="mut">No members yet. Tap Add member to create the first one.</p>';
}
function memberForm(id){
  const m=id?members.find(x=>x.id===id):null;
  openForm(m?'Edit member':'Add member',[
    {k:'name',l:'Name',req:1},{k:'phone',l:'Phone',t:'tel'},
    {k:'plan_id',l:'Plan',t:'select',o:plans.map(p=>[p.id,p.name])},
    {k:'start_date',l:'Start date',t:'date',req:1},{k:'expiry_date',l:'Expiry date',t:'date',req:1},
    {k:'status',l:'Status',t:'select',req:1,o:[['active','Active'],['inactive','Inactive']]}],
    m||{start_date:today(),status:'active'},
    async o=>{if(m)ok(await sb.from('members').update(o).eq('id',m.id));
      else ok(await sb.from('members').insert({...o,gym_id:gym.id,joining_date:o.start_date}))},
    f=>{const calc=()=>{const p=pOf(f.plan_id.value);if(p&&f.start_date.value)f.expiry_date.value=addM(f.start_date.value,p.duration_months)};
      f.plan_id.onchange=calc;f.start_date.onchange=calc});
}
function renew(id){
  const m=members.find(x=>x.id===id),p=pOf(m.plan_id);
  if(!p){alert('Assign a plan to this member first (tap Edit).');return}
  const t=today(),lapsed=!m.expiry_date||m.expiry_date<t,base=lapsed?t:m.expiry_date;
  if(!confirm(`Renew ${m.name} for ${p.duration_months} month(s)?`))return;
  act(async()=>{
    ok(await sb.from('members').update({start_date:lapsed?t:m.start_date,expiry_date:addM(base,p.duration_months),status:'active'}).eq('id',id));
    await reload();
    if(confirm('Renewed. Record the payment now?'))paymentForm({member_id:id,amount:p.price});
  });
}

V.plans=async()=>{
  $('#main').innerHTML=`<h2>Membership plans</h2><div class="bar"><button class="btn" onclick="planForm()">Add plan</button></div>`+
  (plans.length?plans.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="mut">${p.duration_months} month(s) · ${money(p.price)} · ${members.filter(m=>m.plan_id===p.id).length} member(s)</div></div>
   <div class="acts"><button class="btn sm ghost" onclick="planForm('${p.id}')">Edit</button><button class="btn sm red" onclick="del('membership_plans','${p.id}','Delete this plan?')">Delete</button></div></div>`).join(''):'<p class="mut">No plans yet. Add one, for example Monthly for 1 month.</p>');
};
function planForm(id){
  const p=id?pOf(id):null;
  openForm(p?'Edit plan':'Add plan',[{k:'name',l:'Plan name',req:1},{k:'duration_months',l:'Duration (months)',t:'number',req:1},{k:'price',l:'Price',t:'number',req:1}],p||{},
    async o=>{o.duration_months=parseInt(o.duration_months,10);o.price=Number(o.price);
      if(p)ok(await sb.from('membership_plans').update(o).eq('id',p.id));
      else ok(await sb.from('membership_plans').insert({...o,gym_id:gym.id}))});
}

let attDate=today();
V.attendance=async()=>{
  const rows=ok(await sb.from('attendance').select('*').eq('gym_id',gym.id).eq('attended_on',attDate).order('check_in',{ascending:false}));
  $('#main').innerHTML=`<h2>Attendance</h2><div class="bar"><input type="date" id="ad" value="${attDate}" style="max-width:180px"><button class="btn" onclick="attForm()">Check in a member</button></div>
  <p class="mut">${rows.length} check-in(s) on ${attDate}</p>`+
  rows.map(r=>`<div class="item"><div><b>${esc(mName(r.member_id))}</b><div class="mut">${(r.check_in||'').slice(0,5)}</div></div><button class="btn sm red" onclick="del('attendance','${r.id}')">Remove</button></div>`).join('');
  $('#ad').onchange=e=>{attDate=e.target.value||today();render()};
};
function attForm(){
  openForm('Check in',[{k:'member_id',l:'Member',t:'select',req:1,o:members.filter(m=>eff(m)==='active').map(m=>[m.id,m.name])}],{},
    async o=>{const n=new Date();
      ok(await sb.from('attendance').insert({member_id:o.member_id,gym_id:gym.id,attended_on:attDate,check_in:n.toTimeString().slice(0,8)}))});
}

V.payments=async()=>{
  const rows=ok(await sb.from('payments').select('*').eq('gym_id',gym.id).order('payment_date',{ascending:false}).limit(100));
  $('#main').innerHTML=`<h2>Payments</h2><div class="bar"><button class="btn" onclick="paymentForm()">Record payment</button></div>`+
  (rows.length?rows.map(r=>`<div class="item"><div><b>${esc(mName(r.member_id))}</b> <span class="tag ${r.status==='paid'?'paid':'pending'}">${esc(r.status)}</span>
   <div class="mut">${money(r.amount)} · ${esc(r.payment_method||'—')} · ${r.payment_date||'—'}</div></div>
   <div class="acts">${r.status!=='paid'?`<button class="btn sm" onclick="markPaid('${r.id}')">Mark paid</button>`:''}<button class="btn sm red" onclick="del('payments','${r.id}')">Delete</button></div></div>`).join(''):'<p class="mut">No payments recorded yet.</p>');
};
function paymentForm(v){
  openForm('Record payment',[
    {k:'member_id',l:'Member',t:'select',req:1,o:members.map(m=>[m.id,m.name])},
    {k:'amount',l:'Amount',t:'number',req:1},{k:'payment_date',l:'Date',t:'date',req:1},
    {k:'payment_method',l:'Method',t:'select',req:1,o:[['cash','Cash'],['card','Card'],['upi','UPI'],['bank_transfer','Bank transfer']]},
    {k:'status',l:'Status',t:'select',req:1,o:[['paid','Paid'],['pending','Pending']]}],
    {payment_date:today(),status:'paid',...(v||{})},
    async o=>{o.amount=Number(o.amount);ok(await sb.from('payments').insert({...o,gym_id:gym.id}));view='payments'});
}
const markPaid=id=>act(async()=>{ok(await sb.from('payments').update({status:'paid'}).eq('id',id));await reload()});

start();
</script>
</body>
</html>
